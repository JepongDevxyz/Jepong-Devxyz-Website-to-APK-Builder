name: Task 2 Inline Verify

on:
  push:
    branches: [capability-verification-task2]

permissions:
  contents: read

jobs:
  verify-native-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_ID: task2-native-permissions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Native permission generator verification
        run: node scripts/test-native-permissions.mjs
      - name: Create representative Native configuration
        shell: bash
        run: |
          mkdir -p builds
          cat > "builds/$BUILD_ID.json" <<'EOF'
          {
            "websiteUrl": "https://example.com",
            "appName": "Native Permission Verification",
            "packageName": "com.jepongdevxyz.nativepermissionverify",
            "versionName": "1.0.0",
            "versionCode": 1,
            "engine": "native",
            "renderMode": "default",
            "orientation": "auto",
            "permissions": ["camera","microphone","location","files"],
            "controls": [],
            "extensions": [],
            "oneSignalAppId": "",
            "offlineFallback": "Offline",
            "iconDataUrl": "",
            "splashDataUrl": "",
            "splashEnabled": false,
            "splashDuration": 0,
            "sizeOptimization": false,
            "abiTarget": "universal"
          }
          EOF
      - name: Validate and generate real Native project
        shell: bash
        run: |
          node scripts/build.mjs prepare --build-id "$BUILD_ID"
          node scripts/build.mjs generate --build-id "$BUILD_ID"
      - name: Build real Native release APK
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Sign and verify installable APK
        shell: bash
        run: |
          RAW_APK="$(find "work/$BUILD_ID/project/app/build/outputs/apk/release" -name '*.apk' | head -n 1)"
          test -n "$RAW_APK" && test -f "$RAW_APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/task2.keystore" -storepass changeit -keypass changeit -alias task2 -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Task2 Verification,O=JepongDevxyz,C=PH"
          "$BUILD_TOOLS/zipalign" -f 4 "$RAW_APK" "$RUNNER_TEMP/native-task2-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/task2.keystore" --ks-pass pass:changeit --key-pass pass:changeit --ks-key-alias task2 --out "$RUNNER_TEMP/native-task2-signed.apk" "$RUNNER_TEMP/native-task2-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/native-task2-signed.apk"
          "$BUILD_TOOLS/aapt2" dump badging "$RUNNER_TEMP/native-task2-signed.apk" | head -n 5
          test -s "$RUNNER_TEMP/native-task2-signed.apk"
      - name: Print physical-device verification cases
        run: node scripts/runtime/native-permission-smoke.mjs --print-cases
      - name: Capability policy and full regression suite
        shell: bash
        run: |
          node scripts/test-capability-evidence-policy.mjs
          node scripts/test-capability-truth.mjs
          npm test
          npm run check
