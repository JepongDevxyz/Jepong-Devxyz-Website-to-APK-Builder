name: Verify Splash Signer Fix

on:
  push:
    branches:
      - fix-splash-apksigner-three-engines
  workflow_dispatch:

permissions:
  contents: read

jobs:
  splash-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run full regression suite
        run: npm test

      - name: Run syntax checks
        run: npm run check

  runtime-and-signing:
    needs: splash-contract
    name: Runtime + signer ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [native, capacitor, cordova]

    env:
      ENGINE: ${{ matrix.engine }}
      BUILD_ID: splash-fix-${{ matrix.engine }}
      EXPECTED_SIGNER_SHA256: f5e197d89410cb681acc9cd803f277e06c05ac2fa843adb9603fc3b4fdb1c3a2
      TEST_SPLASH_SHA256: b73cbbba171e8ab856ea575a211a8fcc8e683164db5b0b2ca539a8eda7d1405c

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21 for Capacitor
        if: matrix.engine == 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Java 17
        if: matrix.engine != 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create custom splash build configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const engine=process.env.ENGINE;
          const packageName=`com.jepongdevxyz.splash${engine}`;
          const splash='';

          const config={
            websiteUrl:'https://example.com',
            appName:`Splash Fix ${engine}`,
            packageName,
            versionName:'1.0.0',
            versionCode:1,
            engine,
            renderMode:'default',
            orientation:'auto',
            permissions:[],
            controls:[],
            extensions:[],
            oneSignalAppId:'',
            offlineFallback:'Offline',
            iconDataUrl:'',
            splashEnabled:true,
            splashDataUrl:`data:image/png;base64,${splash}`,
            splashDuration:6000,
            apkSigner:true,
            sizeOptimization:false,
            abiTarget:'universal'
          };

          fs.writeFileSync(
            `builds/${process.env.BUILD_ID}.json`,
            JSON.stringify(config,null,2)
          );

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PACKAGE_NAME=${packageName}\n`
          );
          NODE

      - name: Validate and generate project
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs prepare --build-id "$BUILD_ID"
          node scripts/build.mjs generate --build-id "$BUILD_ID"

      - name: Setup Gradle 9.6 for Native
        if: matrix.engine == 'native'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Setup Gradle for Capacitor
        if: matrix.engine == 'capacitor'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Setup Gradle for Cordova
        if: matrix.engine == 'cordova'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.2'

      - name: Generate Android platform for Capacitor
        if: matrix.engine == 'capacitor'
        shell: bash
        run: |
          set -euo pipefail
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cap add android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs \
            --build-id "$BUILD_ID" \
            --engine capacitor

      - name: Generate Android platform for Cordova
        if: matrix.engine == 'cordova'
        shell: bash
        run: |
          set -euo pipefail
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cordova platform add android@15.1.0
          npx cordova prepare android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs \
            --build-id "$BUILD_ID" \
            --engine cordova

      - name: Verify generated splash injection
        shell: bash
        run: |
          set -euo pipefail

          case "$ENGINE" in
            native)
              APP_ROOT="work/$BUILD_ID/project/app"
              ;;
            capacitor)
              APP_ROOT="work/$BUILD_ID/project/android/app"
              ;;
            cordova)
              APP_ROOT="work/$BUILD_ID/project/platforms/android/app"
              ;;
          esac

          MANIFEST="$APP_ROOT/src/main/AndroidManifest.xml"
          JAVA_ROOT="$APP_ROOT/src/main/java/${PACKAGE_NAME//./\/}"
          SPLASH_JAVA="$JAVA_ROOT/JepongSplashActivity.java"
          MAIN_JAVA="$JAVA_ROOT/MainActivity.java"
          SPLASH_ASSET="$(find "$APP_ROOT/src/main/res/drawable-nodpi" -maxdepth 1 -type f -name 'app_splash.*' | head -n 1)"

          test -f "$MANIFEST"
          test -f "$SPLASH_JAVA"
          test -f "$MAIN_JAVA"
          test -f "$SPLASH_ASSET"

          grep -q 'android:name=".JepongSplashActivity"' "$MANIFEST"
          test "$(grep -o 'android.intent.category.LAUNCHER' "$MANIFEST" | wc -l)" -eq 1
          grep -q 'R.drawable.app_splash' "$SPLASH_JAVA"
          grep -q 'ImageView.ScaleType.CENTER_CROP' "$SPLASH_JAVA"
          grep -q '6000L' "$SPLASH_JAVA"

          if grep -q 'ImageView brandSplash=' "$MAIN_JAVA"; then
            echo "::error::Legacy in-activity splash overlay is still present"
            exit 1
          fi

          if [ "$ENGINE" = "native" ] && grep -q 'setContentView(splash)' "$MAIN_JAVA"; then
            echo "::error::Legacy Native splash path is still present"
            exit 1
          fi

          ACTUAL_SPLASH_SHA256="$(sha256sum "$SPLASH_ASSET" | awk '{print $1}')"
          test "$ACTUAL_SPLASH_SHA256" = "$TEST_SPLASH_SHA256"

          echo "Custom splash asset SHA-256: $ACTUAL_SPLASH_SHA256"
          echo "Dedicated splash launcher contract verified for $ENGINE"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          case "$ENGINE" in
            native)
              cd "work/$BUILD_ID/project"
              gradle --no-daemon :app:assembleRelease --stacktrace
              ;;
            capacitor)
              cd "work/$BUILD_ID/project/android"
              chmod +x gradlew
              ./gradlew --no-daemon assembleRelease --stacktrace
              ;;
            cordova)
              cd "work/$BUILD_ID/project/platforms/android"
              gradle --no-daemon assembleRelease --stacktrace
              ;;
          esac

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(node scripts/build.mjs locate-apk --build-id "$BUILD_ID" | tail -n 1)"
          test -s "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Production sign and verify exact final APK
        id: signing
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in \
            APK_KEYSTORE_BASE64 \
            APK_KEYSTORE_PASSWORD \
            APK_KEY_ALIAS \
            APK_KEY_PASSWORD
          do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is missing"
              exit 1
            fi
          done

          RAW_APK="${{ steps.apk.outputs.apk }}"
          OUT_DIR="$GITHUB_WORKSPACE/dist/$ENGINE"
          mkdir -p "$OUT_DIR"

          ALIGNED="$RUNNER_TEMP/${ENGINE}-aligned.apk"
          FINAL_APK="$OUT_DIR/Splash-Fix-${ENGINE}-production-signed.apk"
          KEYSTORE="$RUNNER_TEMP/jepong-production-signing.jks"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -x "$AAPT2"

          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          "$ZIPALIGN" -f -p 4 "$RAW_APK" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass "pass:$APK_KEYSTORE_PASSWORD" \
            --key-pass "pass:$APK_KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$ALIGNED"

          "$ZIPALIGN" -c -v 4 "$FINAL_APK"

          SIGNER_OUTPUT="$(
            "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              "$FINAL_APK"
          )"

          printf '%s\n' "$SIGNER_OUTPUT"
          printf '%s\n' "$SIGNER_OUTPUT" > "$OUT_DIR/apksigner-verification.txt"

          CERT_SHA256="$(
            printf '%s\n' "$SIGNER_OUTPUT" |
            sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d ':[:space:]'
          )"

          EXPECTED="$(
            printf '%s' "$EXPECTED_SIGNER_SHA256" |
            tr '[:upper:]' '[:lower:]' |
            tr -d ':[:space:]'
          )"

          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED"

          printf '%s\n' "$SIGNER_OUTPUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$SIGNER_OUTPUT" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true'

          "$AAPT2" dump badging "$FINAL_APK" > "$OUT_DIR/aapt2-badging.txt"
          grep -q "package: name='$PACKAGE_NAME'" "$OUT_DIR/aapt2-badging.txt"

          sha256sum "$FINAL_APK" > "$OUT_DIR/apk-sha256.txt"

          echo "final_apk=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

          echo "Production signer verified for exact final $ENGINE APK"

      - name: Create API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          echo no | avdmanager create avd \
            -n jepong-splash-api35 \
            -k "system-images;android-35;google_apis;x86_64" \
            --force

      - name: Verify splash runtime on API 35
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "dist/$ENGINE/runtime"

          "$ANDROID_HOME/emulator/emulator" \
            -avd jepong-splash-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "dist/$ENGINE/runtime/emulator.log" 2>&1 &

          adb wait-for-device

          timeout 240 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 2
            done
          '

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          FINAL_APK="${{ steps.signing.outputs.final_apk }}"
          adb install -r "$FINAL_APK"

          RESOLVED="$(
            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "$PACKAGE_NAME" |
            tr -d '\r'
          )"

          echo "Resolved launcher: $RESOLVED"
          printf '%s\n' "$RESOLVED" | grep -q 'JepongSplashActivity'

          adb shell am force-stop "$PACKAGE_NAME"
          adb shell am start \
            -a android.intent.action.MAIN \
            -c android.intent.category.LAUNCHER \
            -p "$PACKAGE_NAME"

          sleep 2

          TOP_DURING="$(
            adb shell dumpsys activity activities |
            grep -m1 'mResumedActivity' |
            tr -d '\r' || true
          )"

          echo "Top during splash: $TOP_DURING"
          printf '%s\n' "$TOP_DURING" | grep -q 'JepongSplashActivity'

          adb exec-out screencap -p \
            > "dist/$ENGINE/runtime/splash-during.png"

          sleep 6

          TOP_AFTER="$(
            adb shell dumpsys activity activities |
            grep -m1 'mResumedActivity' |
            tr -d '\r' || true
          )"

          echo "Top after splash: $TOP_AFTER"
          printf '%s\n' "$TOP_AFTER" | grep -q 'MainActivity'

          adb exec-out screencap -p \
            > "dist/$ENGINE/runtime/after-splash.png"

          printf '%s\n' "$RESOLVED" > "dist/$ENGINE/runtime/resolved-launcher.txt"
          printf '%s\n' "$TOP_DURING" > "dist/$ENGINE/runtime/top-during-splash.txt"
          printf '%s\n' "$TOP_AFTER" > "dist/$ENGINE/runtime/top-after-splash.txt"

          echo "API 35 splash lifecycle verified for $ENGINE"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: splash-signer-evidence-${{ matrix.engine }}
          path: dist/${{ matrix.engine }}
          if-no-files-found: warn
          retention-days: 30
