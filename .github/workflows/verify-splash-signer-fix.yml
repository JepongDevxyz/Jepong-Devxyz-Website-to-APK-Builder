name: Verify Splash Signer Fix

on:
  push:
    branches: [fix-splash-apksigner-three-engines]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  splash-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run full regression suite
        run: npm test
      - name: Run syntax checks
        run: npm run check

  runtime-and-signing:
    needs: splash-contract
    name: Runtime + signer ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        engine: [native, capacitor, cordova]
    env:
      ENGINE: ${{ matrix.engine }}
      BUILD_ID: splash-fix-${{ matrix.engine }}
      EXPECTED_SIGNER_SHA256: f5e197d89410cb681acc9cd803f277e06c05ac2fa843adb9603fc3b4fdb1c3a2
      TEST_SPLASH_SHA256: bdf2f5a0f525f14d1d6dd13a985c4aa6ee40db7c80ba8f8922b15d23f6e4b333

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21 for Capacitor
        if: matrix.engine == 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Java 17
        if: matrix.engine != 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Install Android build SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create custom splash build configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const engine=process.env.ENGINE;
          const packageName=`com.jepongdevxyz.splash${engine}`;
          const splash='iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYUlEQVR4nO3PMQ0AIADAMMC/HPyBCI6GZFWwzbHP+NnSAa8a0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0C4+HQIzygodHQAAAABJRU5ErkJggg==';
          const config={
            websiteUrl:'https://example.com',
            appName:`Splash Fix ${engine}`,
            packageName,
            versionName:'1.0.0',
            versionCode:1,
            engine,
            renderMode:'default',
            orientation:'auto',
            permissions:[],
            controls:[],
            extensions:[],
            oneSignalAppId:'',
            offlineFallback:'Offline',
            iconDataUrl:'',
            splashEnabled:true,
            splashDataUrl:`data:image/png;base64,${splash}`,
            splashDuration:6000,
            apkSigner:true,
            sizeOptimization:false,
            abiTarget:'universal'
          };
          fs.writeFileSync(`builds/${process.env.BUILD_ID}.json`,JSON.stringify(config,null,2));
          fs.appendFileSync(process.env.GITHUB_ENV,`PACKAGE_NAME=${packageName}\n`);
          NODE

      - name: Validate and generate project
        run: |
          node scripts/build.mjs prepare --build-id "$BUILD_ID"
          node scripts/build.mjs generate --build-id "$BUILD_ID"

      - name: Setup Gradle 9.6 for Native
        if: matrix.engine == 'native'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Setup Gradle for Capacitor
        if: matrix.engine == 'capacitor'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Setup Gradle for Cordova
        if: matrix.engine == 'cordova'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.2'

      - name: Generate Android platform for Capacitor
        if: matrix.engine == 'capacitor'
        run: |
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cap add android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs --build-id "$BUILD_ID" --engine capacitor

      - name: Generate Android platform for Cordova
        if: matrix.engine == 'cordova'
        run: |
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cordova platform add android@15.1.0
          npx cordova prepare android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs --build-id "$BUILD_ID" --engine cordova

      - name: Verify generated custom splash injection
        shell: bash
        run: |
          set -euo pipefail
          case "$ENGINE" in
            native) APP_ROOT="work/$BUILD_ID/project/app" ;;
            capacitor) APP_ROOT="work/$BUILD_ID/project/android/app" ;;
            cordova) APP_ROOT="work/$BUILD_ID/project/platforms/android/app" ;;
          esac
          MANIFEST="$APP_ROOT/src/main/AndroidManifest.xml"
          JAVA_ROOT="$APP_ROOT/src/main/java/${PACKAGE_NAME//./\/}"
          SPLASH_JAVA="$JAVA_ROOT/JepongSplashActivity.java"
          MAIN_JAVA="$JAVA_ROOT/MainActivity.java"
          SPLASH_ASSET="$(find "$APP_ROOT/src/main/res/drawable-nodpi" -maxdepth 1 -type f -name 'app_splash.*' | head -n 1)"
          test -f "$MANIFEST" && test -f "$SPLASH_JAVA" && test -f "$MAIN_JAVA" && test -f "$SPLASH_ASSET"
          grep -q 'android:name=".JepongSplashActivity"' "$MANIFEST"
          test "$(grep -o 'android.intent.category.LAUNCHER' "$MANIFEST" | wc -l)" -eq 1
          grep -q 'R.drawable.app_splash' "$SPLASH_JAVA"
          grep -q 'ImageView.ScaleType.CENTER_CROP' "$SPLASH_JAVA"
          grep -q '6000L' "$SPLASH_JAVA"
          ! grep -q 'ImageView brandSplash=' "$MAIN_JAVA"
          if [ "$ENGINE" = "native" ]; then ! grep -q 'setContentView(splash)' "$MAIN_JAVA"; fi
          ACTUAL="$(sha256sum "$SPLASH_ASSET" | awk '{print $1}')"
          echo "Custom splash asset SHA-256: $ACTUAL"
          test "$ACTUAL" = "$TEST_SPLASH_SHA256"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          case "$ENGINE" in
            native)
              cd "work/$BUILD_ID/project"
              gradle --no-daemon :app:assembleRelease --stacktrace
              ;;
            capacitor)
              cd "work/$BUILD_ID/project/android"
              chmod +x gradlew
              ./gradlew --no-daemon assembleRelease --stacktrace
              ;;
            cordova)
              cd "work/$BUILD_ID/project/platforms/android"
              gradle --no-daemon assembleRelease --stacktrace
              ;;
          esac

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(node scripts/build.mjs locate-apk --build-id "$BUILD_ID" | tail -n 1)"
          test -s "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Production sign and verify exact final APK
        id: signing
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in APK_KEYSTORE_BASE64 APK_KEYSTORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD; do
            [ -n "${!variable:-}" ] || { echo "::error::$variable is missing"; exit 1; }
          done
          RAW_APK="${{ steps.apk.outputs.apk }}"
          OUT_DIR="$GITHUB_WORKSPACE/dist/$ENGINE"
          mkdir -p "$OUT_DIR"
          ALIGNED="$RUNNER_TEMP/${ENGINE}-aligned.apk"
          FINAL_APK="$OUT_DIR/Splash-Fix-${ENGINE}-production-signed.apk"
          KEYSTORE="$RUNNER_TEMP/jepong-production-signing.jks"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$ZIPALIGN" && test -x "$APKSIGNER" && test -x "$AAPT2"
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          "$ZIPALIGN" -f -p 4 "$RAW_APK" "$ALIGNED"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$APK_KEY_ALIAS" --ks-pass "pass:$APK_KEYSTORE_PASSWORD" --key-pass "pass:$APK_KEY_PASSWORD" --out "$FINAL_APK" "$ALIGNED"
          "$ZIPALIGN" -c -v 4 "$FINAL_APK"
          SIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$FINAL_APK")"
          printf '%s\n' "$SIGNER_OUTPUT" | tee "$OUT_DIR/apksigner-verification.txt"
          CERT_SHA256="$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$CERT_SHA256" && test "$CERT_SHA256" = "$EXPECTED"
          printf '%s\n' "$SIGNER_OUTPUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$SIGNER_OUTPUT" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true'
          "$AAPT2" dump badging "$FINAL_APK" > "$OUT_DIR/aapt2-badging.txt"
          grep -q "package: name='$PACKAGE_NAME'" "$OUT_DIR/aapt2-badging.txt"
          sha256sum "$FINAL_APK" > "$OUT_DIR/apk-sha256.txt"
          echo "final_apk=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "Production signer verified for exact final $ENGINE APK"

      - name: Verify splash runtime on API 35
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          FINAL_APK: ${{ steps.signing.outputs.final_apk }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p "dist/$ENGINE/runtime"
            adb install -r "$FINAL_APK"
            RESOLVED="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE_NAME" | tr -d '\r')"
            echo "Resolved launcher: $RESOLVED"
            printf '%s\n' "$RESOLVED" | grep -q 'JepongSplashActivity'
            adb shell am force-stop "$PACKAGE_NAME"
            adb shell am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$PACKAGE_NAME"
            sleep 2
            TOP_DURING="$(adb shell dumpsys activity activities | grep -m1 'mResumedActivity' | tr -d '\r' || true)"
            echo "Top during splash: $TOP_DURING"
            printf '%s\n' "$TOP_DURING" | grep -q 'JepongSplashActivity'
            adb exec-out screencap -p > "dist/$ENGINE/runtime/splash-during.png"
            sleep 6
            TOP_AFTER="$(adb shell dumpsys activity activities | grep -m1 'mResumedActivity' | tr -d '\r' || true)"
            echo "Top after splash: $TOP_AFTER"
            printf '%s\n' "$TOP_AFTER" | grep -q 'MainActivity'
            adb exec-out screencap -p > "dist/$ENGINE/runtime/after-splash.png"
            printf '%s\n' "$RESOLVED" > "dist/$ENGINE/runtime/resolved-launcher.txt"
            printf '%s\n' "$TOP_DURING" > "dist/$ENGINE/runtime/top-during-splash.txt"
            printf '%s\n' "$TOP_AFTER" > "dist/$ENGINE/runtime/top-after-splash.txt"
            echo "API 35 splash lifecycle verified for $ENGINE"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: splash-signer-evidence-${{ matrix.engine }}
          path: dist/${{ matrix.engine }}
          if-no-files-found: warn
          retention-days: 30
