name: Task 4 Launcher Contract

on:
  push:
    branches: [capability-verification-task4]

permissions:
  contents: read

jobs:
  launcher-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/test-task4-webview-launch-contract.mjs
