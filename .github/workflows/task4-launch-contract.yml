name: Task 4 Launcher Contract

on:
  push:
    branches: [capability-verification-task4]

permissions:
  contents: read

jobs:
  launcher-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Launcher stabilization contract
        run: node scripts/test-task4-webview-launch-contract.mjs
      - name: Deterministic WebView startup integration
        run: node scripts/test-webview-startup.mjs
      - name: Cordova HTTP cleartext policy
        run: node scripts/test-cordova-cleartext-policy.mjs
      - name: Cordova AppCompat activity theme
        run: node scripts/test-cordova-appcompat-theme.mjs
