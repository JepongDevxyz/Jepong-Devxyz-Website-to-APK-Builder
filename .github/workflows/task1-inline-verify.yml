name: Task 1 Inline Verify

on:
  push:
    branches: [capability-verification-task1]

permissions:
  contents: read

jobs:
  verify-task1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Capability evidence policy
        run: node scripts/test-capability-evidence-policy.mjs
      - name: Capability truth
        run: node scripts/test-capability-truth.mjs
      - name: Full tests
        run: npm test
      - name: Syntax checks
        run: npm run check
