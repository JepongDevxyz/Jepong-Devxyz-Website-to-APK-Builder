name: Temp Branding Red Green
on:
  push:
    branches: [fix-branding-signer-clean]
permissions:
  contents: read
jobs:
  branding-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/test-default-branding-assets.mjs
