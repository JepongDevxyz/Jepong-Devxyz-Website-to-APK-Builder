name: Temp Branding Red Green
on:
  push:
    branches: [fix-branding-signer-clean]
permissions:
  contents: read
jobs:
  branding-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Inspect assets
        run: |
          sha256sum assets/default-icon.* assets/default-splash.*
          file assets/default-icon.* assets/default-splash.*
      - name: Branding contract
        continue-on-error: true
        run: node scripts/test-default-branding-assets.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: approved-branding-preview
          path: |
            assets/default-icon.png
            assets/default-icon.webp
            assets/default-splash.png
            assets/default-splash.webp
