name: Task 4 Gecko Verify

on:
  push:
    branches: [capability-verification-task4]

permissions:
  contents: read

jobs:
  gecko-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_ID: task4-gecko-controls
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Install Gecko Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.1" \
            "build-tools;37.0.0" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Gecko generator verification
        run: node scripts/test-gecko-capability-verification.mjs

      - name: Create representative Gecko configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          cat > "builds/$BUILD_ID.json" <<'EOF'
          {
            "websiteUrl": "http://10.0.2.2:8765/index.html",
            "appName": "Gecko Controls Verification",
            "packageName": "com.jepongdevxyz.geckocontrolsverify",
            "versionName": "1.0.0",
            "versionCode": 1,
            "engine": "gecko",
            "renderMode": "default",
            "orientation": "auto",
            "permissions": ["notification","files"],
            "controls": ["transparentNav","navigationToolbar","externalLinks","downloadManager"],
            "extensions": [],
            "oneSignalAppId": "",
            "offlineFallback": "Offline",
            "iconDataUrl": "",
            "splashDataUrl": "",
            "splashEnabled": false,
            "splashDuration": 0,
            "apkSigner": false,
            "sizeOptimization": false,
            "abiTarget": "universal"
          }
          EOF
          node scripts/build.mjs prepare --build-id "$BUILD_ID"
          node scripts/build.mjs generate --build-id "$BUILD_ID"

      - name: Build Gecko APK
        shell: bash
        run: |
          set -euo pipefail
          cd "work/$BUILD_ID/project"
          gradle --no-daemon :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Emulator runtime smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            node scripts/runtime/gecko-controls-ci-smoke.mjs "$(find "work/$BUILD_ID/project/app/build/outputs/apk/debug" -name '*.apk' | head -n 1)"

      - name: Static Task 4 verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-capability-evidence-policy.mjs
          node scripts/test-capability-truth.mjs
          npm test
          npm run check
