name: Task 3 Inline Verify

on:
  push:
    branches: [capability-verification-task3]

permissions:
  contents: read

jobs:
  native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_ID: task3-native-controls
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Native controls generator verification
        run: node scripts/test-native-controls-verification.mjs
      - name: Create representative Native controls configuration
        shell: bash
        run: |
          mkdir -p builds
          cat > "builds/$BUILD_ID.json" <<'EOF'
          {
            "websiteUrl": "http://10.0.2.2:8765/index.html",
            "appName": "Native Controls Verification",
            "packageName": "com.jepongdevxyz.nativecontrolsverify",
            "versionName": "1.0.0",
            "versionCode": 1,
            "engine": "native",
            "renderMode": "default",
            "orientation": "auto",
            "permissions": [],
            "controls": ["pullRefresh","hideScrollbars","transparentNav","pinchZoom","disableCopy","blockAdsRedirects","navigationToolbar","externalLinks","downloadManager"],
            "extensions": [],
            "oneSignalAppId": "",
            "offlineFallback": "Offline",
            "iconDataUrl": "",
            "splashDataUrl": "",
            "splashEnabled": false,
            "splashDuration": 0,
            "sizeOptimization": false,
            "abiTarget": "universal"
          }
          EOF
          node scripts/build.mjs prepare --build-id "$BUILD_ID"
          node scripts/build.mjs generate --build-id "$BUILD_ID"
      - name: Instrument generated Native Back dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files=list(Path('work').glob('*/project/app/src/main/java/**/MainActivity.java'))
          if len(files)!=1:
              raise SystemExit(f'Expected exactly one generated MainActivity.java, found {len(files)}')

          p=files[0]
          s=p.read_text()

          replacements=[
              (
                  '  void showExitConfirmation(){\n',
                  '  void showExitConfirmation(){\n    android.util.Log.d("JepongBack","showExitConfirmation");\n'
              ),
              (
                  '  void handleAppBack(){\n',
                  '  void handleAppBack(){\n    android.util.Log.d("JepongBack","handleAppBack canGoBack="+(web!=null&&web.canGoBack()));\n'
              ),
              (
                  '  void installBackHandler(){\n',
                  '  void installBackHandler(){\n    android.util.Log.d("JepongBack","installBackHandler sdk="+Build.VERSION.SDK_INT);\n'
              ),
              (
                  '          this::handleAppBack\n',
                  '          ()->{ android.util.Log.d("JepongBack","onBackInvoked"); handleAppBack(); }\n'
              ),
              (
                  '  public void onBackPressed(){\n    handleAppBack();\n',
                  '  public void onBackPressed(){\n    android.util.Log.d("JepongBack","onBackPressed");\n    handleAppBack();\n'
              ),
          ]

          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'Back instrumentation marker count={s.count(old)} for {old!r}')
              s=s.replace(old,new,1)

          p.write_text(s)
          print(f'Instrumented {p}')
          PY
      - name: Build Native controls APK
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Emulator runtime smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            node scripts/runtime/native-controls-smoke.mjs "$(find "work/$BUILD_ID/project/app/build/outputs/apk/debug" -name '*.apk' | head -n 1)"
            || { echo '--- JepongBack trace ---'; adb logcat -d -t 500 | grep -E 'JepongBack|OnBackInvoked|BackNavigation' || true; exit 1; }
      - name: Full Task 3 verification
        shell: bash
        run: |
          node scripts/test-native-controls-verification.mjs
          node scripts/test-capability-evidence-policy.mjs
          node scripts/test-capability-truth.mjs
          npm test
          npm run check
