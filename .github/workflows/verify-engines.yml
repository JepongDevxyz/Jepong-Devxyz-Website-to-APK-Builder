name: Verify All APK Engines

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [native, gecko, capacitor, cordova]
    env:
      ENGINE: ${{ matrix.engine }}
      BUILD_ID: ci-${{ matrix.engine }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21 for Capacitor
        if: matrix.engine == 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Java 17
        if: matrix.engine != 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ "$ENGINE" = "gecko" ]; then
            sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;37.0.0"
          else
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Run generator tests
        run: npm test

      - name: Create CI build configuration
        shell: bash
        run: |
          mkdir -p builds

          PERMISSIONS='["camera","microphone","notification","location","media","contacts","calendar","biometrics","files","bluetooth","sensors"]'

          SIZE_OPTIMIZATION=false
          ABI_TARGET="universal"

          case "$ENGINE" in
            native)
              CONTROLS='["pullRefresh","hideScrollbars","transparentNav","pinchZoom","disableCopy","blockAdsRedirects"]'
              EXTENSIONS='[]'
              ;;
            gecko)
              CONTROLS='["transparentNav"]'
              EXTENSIONS='["adguard","ghostery","privacyBadger","darkReader","ublock"]'
              SIZE_OPTIMIZATION=true
              ABI_TARGET="arm64-v8a"
              ;;
            capacitor|cordova)
              CONTROLS='["transparentNav","pinchZoom"]'
              EXTENSIONS='[]'
              ;;
          esac
          cat > "builds/$BUILD_ID.json" <<EOF
          {
            "websiteUrl": "https://example.com",
            "appName": "Jepong Devxyz CI",
            "packageName": "com.jepongdevxyz.app",
            "versionName": "1.0.0",
            "versionCode": 1,
            "engine": "$ENGINE",
            "renderMode": "default",
            "orientation": "auto",
            "permissions": $PERMISSIONS,
            "controls": $CONTROLS,
            "extensions": $EXTENSIONS,
            "oneSignalAppId": "11111111-1111-1111-1111-111111111111",
            "offlineFallback": "Offline",
            "iconDataUrl": "",
            "splashDataUrl": "",
            "splashEnabled": true,
            "splashDuration": 1500,
            "sizeOptimization": $SIZE_OPTIMIZATION,
            "abiTarget": "$ABI_TARGET"
          }
          EOF

      - name: Validate build configuration
        run: node scripts/build.mjs prepare --build-id "$BUILD_ID"

      - name: Generate engine project
        run: node scripts/build.mjs generate --build-id "$BUILD_ID"

      - name: Setup Gradle 9.6 for Native/Gecko
        if: matrix.engine == 'native' || matrix.engine == 'gecko'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build Native/Gecko APK
        if: matrix.engine == 'native' || matrix.engine == 'gecko'
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Setup Gradle for Capacitor
        if: matrix.engine == 'capacitor'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build Capacitor APK
        if: matrix.engine == 'capacitor'
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cap add android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs --build-id "$BUILD_ID" --engine capacitor
          cd "work/$BUILD_ID/project/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Setup Gradle for Cordova
        if: matrix.engine == 'cordova'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.2'

      - name: Build Cordova APK
        if: matrix.engine == 'cordova'
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cordova platform add android@15.1.0
          npx cordova prepare android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs --build-id "$BUILD_ID" --engine cordova
          cd "work/$BUILD_ID/project/platforms/android"
          gradle --no-daemon assembleRelease --stacktrace

      - name: Locate final APK
        id: apk
        shell: bash
        run: |
          APK="$(node scripts/build.mjs locate-apk --build-id "$BUILD_ID" | tail -n 1)"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          BYTES="$(stat -c%s "$APK")"

          echo "size_bytes=$BYTES" >> "$GITHUB_OUTPUT"

          echo "RAW APK SIZE:"
          ls -lh "$APK"

          awk -v b="$BYTES" 'BEGIN {
            printf "Raw APK size: %.2f MiB\n", b / 1048576
          }'

      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: verified-${{ matrix.engine }}-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
