name: Temp Branding Splash Signing Fix

on:
  push:
    branches: [fix-branding-signing-clean-20260915]

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Branding regression
        run: node scripts/test-default-branding-assets.mjs
