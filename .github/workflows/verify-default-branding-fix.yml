name: Verify Default Branding Fix

on:
  push:
    branches:
      - fix-splash-apksigner-three-engines
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run default branding contract
        run: node scripts/test-default-branding-assets.mjs
      - name: Run full regression suite
        run: npm test
      - name: Run syntax and static checks
        run: npm run check
