name: Build APK
run-name: APK ${{ inputs.build_id }} · ${{ inputs.engine }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build configuration ID
        required: true
        type: string
      engine:
        description: Engine
        required: true
        type: choice
        options: [native, gecko, capacitor, cordova]
      config_commit_sha:
        description: Exact commit that stores the build configuration
        required: false
        type: string

permissions:
  contents: read

env:
  BUILD_ID: ${{ inputs.build_id }}
  ENGINE: ${{ inputs.engine }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.config_commit_sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21 for Capacitor
        if: inputs.engine == 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Java 17
        if: inputs.engine != 'capacitor'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          if [ "$ENGINE" = "gecko" ]; then
            sdkmanager \
              "platform-tools" \
              "platforms;android-37.1" \
              "build-tools;37.0.0" \
              "build-tools;36.0.0"
          else
            sdkmanager \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"
          fi

      - name: Validate build configuration
        run: node scripts/build.mjs prepare --build-id "$BUILD_ID"

      - name: Generate engine project
        run: node scripts/build.mjs generate --build-id "$BUILD_ID"

      - name: Setup Gradle 9.6 for Native/Gecko
        if: inputs.engine == 'native' || inputs.engine == 'gecko'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build Native/Gecko APK
        if: inputs.engine == 'native' || inputs.engine == 'gecko'
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Setup Gradle for Capacitor
        if: inputs.engine == 'capacitor'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build Capacitor APK
        if: inputs.engine == 'capacitor'
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cap add android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs --build-id "$BUILD_ID" --engine capacitor
          cd "work/$BUILD_ID/project/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Setup Gradle for Cordova
        if: inputs.engine == 'cordova'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.2'

      - name: Build Cordova APK
        if: inputs.engine == 'cordova'
        shell: bash
        run: |
          cd "work/$BUILD_ID/project"
          npm install --no-audit --no-fund
          npx cordova platform add android@15.1.0
          npx cordova prepare android
          cd "$GITHUB_WORKSPACE"
          node scripts/patch-android-platform.mjs --build-id "$BUILD_ID" --engine cordova
          cd "work/$BUILD_ID/project/platforms/android"
          gradle --no-daemon assembleRelease --stacktrace

      - name: Locate final APK
        id: apk
        shell: bash
        run: |
          APK="$(node scripts/build.mjs locate-apk --build-id "$BUILD_ID" | tail -n 1)"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          BYTES="$(stat -c%s "$APK")"

          echo "size_bytes=$BYTES" >> "$GITHUB_OUTPUT"

          echo "RAW GENERATED APK SIZE:"
          ls -lh "$APK"

          awk -v b="$BYTES" 'BEGIN {
            printf "Raw APK size: %.2f MiB\n", b / 1048576
          }'

      - name: Read APK signing option
        id: signing
        shell: bash
        run: |
          ENABLED="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('builds/'+process.env.BUILD_ID+'.json','utf8')); process.stdout.write(c.apkSigner===true?'true':'false')")"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "Private APK signing enabled: $ENABLED"

      - name: Align and sign installable APK
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk }}"
          ALIGNED="${APK%.apk}-aligned.apk"
          SIGNED="${APK%.apk}-signed.apk"
          KEYSTORE="$RUNNER_TEMP/jepong-signing.jks"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 2 \
            -type f \
            -name zipalign \
            | sort -V \
            | tail -n 1)"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 2 \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)"

          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::zipalign/apksigner not found"
            exit 1
          fi

          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then

            echo "Using private production signing key"

            if [ -z "${APK_KEYSTORE_BASE64:-}" ] || \
               [ -z "${APK_KEYSTORE_PASSWORD:-}" ] || \
               [ -z "${APK_KEY_ALIAS:-}" ] || \
               [ -z "${APK_KEY_PASSWORD:-}" ]; then

              echo "::error::APK Signer is ON but GitHub signing secrets are missing."
              exit 1
            fi

            printf '%s' "$APK_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE"

            STOREPASS="$APK_KEYSTORE_PASSWORD"
            KEYPASS="$APK_KEY_PASSWORD"
            ALIAS="$APK_KEY_ALIAS"

          else

            echo "APK Signer OFF: creating temporary installable test signature"

            STOREPASS="jepong-test-2026"
            KEYPASS="jepong-test-2026"
            ALIAS="jepong-test"

            keytool \
              -genkeypair \
              -noprompt \
              -keystore "$KEYSTORE" \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Jepong Devxyz Test,O=Jepong Devxyz,C=PH"
          fi

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK" \
            "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$KEYPASS" \
            --out "$SIGNED" \
            "$ALIGNED"

          echo "===== VERIFY APK SIGNATURE ====="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED"

          mv "$SIGNED" "$APK"

          rm -f \
            "$ALIGNED" \
            "$KEYSTORE"

          echo "===== FINAL INSTALLABLE APK ====="
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
